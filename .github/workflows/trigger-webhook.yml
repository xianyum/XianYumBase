name: Conditional Call Yunxiao Webhook
on: push

jobs:
  check_msg_and_trigger:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '@build')
    steps:
      - name: Request Yunxiao Webhook
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            ${{ secrets.YUNXIAO_WEBHOOK_URL }}
